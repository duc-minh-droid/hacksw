<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ffb347"/></marker>
    <filter id="rough"><feTurbulence baseFrequency="0.03" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
  </defs>
  <rect width="1000" height="330" rx="18" fill="#14100f"/>
  <text x="32" y="42" fill="#fff" font-size="20" font-weight="600">How a simulated fire is drawn</text>
  <text x="32" y="64" fill="#a8a29e" font-size="13">A hackathon heuristic, not fire physics: weather picks the size, the wind picks the direction of the head.</text>

  <!-- step 1 template -->
  <g transform="translate(125 175)" filter="url(#rough)">
    <path d="M40 0 L37 15 L28 28 L15 37 L0 60 L-15 37 L-28 28 L-37 15 L-40 0 L-37 -15 L-28 -28 L-15 -37 L0 -40 L15 -37 L28 -28 L37 -15 Z" transform="rotate(180)" fill="#3b2a24" stroke="#ffb347" stroke-width="2"/>
  </g>
  <text x="125" y="265" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">1. pick a template</text>
  <text x="125" y="284" fill="#a8a29e" font-size="12" text-anchor="middle">unit circle with a "tail"</text>
  <text x="125" y="300" fill="#a8a29e" font-size="12" text-anchor="middle">(13 hand-made shapes)</text>

  <path d="M205 175 L 265 175" stroke="#ffb347" stroke-width="2" marker-end="url(#a)"/>

  <!-- step 2 scale -->
  <g transform="translate(365 175)" filter="url(#rough)">
    <path d="M40 0 L37 15 L28 28 L15 37 L0 60 L-15 37 L-28 28 L-37 15 L-40 0 L-37 -15 L-28 -28 L-15 -37 L0 -40 L15 -37 L28 -28 L37 -15 Z" transform="rotate(180) scale(1.35)" fill="#4a2c20" stroke="#ff7a3d" stroke-width="2"/>
  </g>
  <text x="365" y="265" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">2. scale by weather</text>
  <text x="365" y="284" fill="#a8a29e" font-size="12" text-anchor="middle">0.005° base, +0.01-0.02 each for</text>
  <text x="365" y="300" fill="#a8a29e" font-size="12" text-anchor="middle">heat ≥ 20/30 °C, RH &lt; 30/20 %, wind ≥ 10 m/s</text>

  <path d="M460 175 L 520 175" stroke="#ffb347" stroke-width="2" marker-end="url(#a)"/>

  <!-- step 3 rotate -->
  <g transform="translate(615 170)" filter="url(#rough)">
    <path d="M40 0 L37 15 L28 28 L15 37 L0 60 L-15 37 L-28 28 L-37 15 L-40 0 L-37 -15 L-28 -28 L-15 -37 L0 -40 L15 -37 L28 -28 L37 -15 Z" transform="rotate(45) scale(1.35)" fill="#4a2c20" stroke="#e8452c" stroke-width="2"/>
  </g>
  <g stroke="#7dd3fc" stroke-width="2.5" fill="none">
    <path d="M700 95 L 668 127" marker-end="url(#a)"/>
    <path d="M718 113 L 686 145" marker-end="url(#a)"/>
  </g>
  <text x="712" y="92" fill="#7dd3fc" font-size="12">wind from NE</text>
  <text x="615" y="265" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">3. rotate downwind</text>
  <text x="615" y="284" fill="#a8a29e" font-size="12" text-anchor="middle">tail points to wind bearing + 180°</text>
  <text x="615" y="300" fill="#a8a29e" font-size="12" text-anchor="middle">then move to the clicked point</text>

  <path d="M720 175 L 775 175" stroke="#ffb347" stroke-width="2" marker-end="url(#a)"/>

  <!-- step 4 nested -->
  <g transform="translate(870 170) rotate(225)" filter="url(#rough)">
    <path d="M40 0 L37 15 L28 28 L15 37 L0 60 L-15 37 L-28 28 L-37 15 L-40 0 L-37 -15 L-28 -28 L-15 -37 L0 -40 L15 -37 L28 -28 L37 -15 Z" transform="rotate(180) scale(1.3)" fill="#9e1f2b" fill-opacity="0.8"/>
    <path d="M40 0 L37 15 L28 28 L15 37 L0 60 L-15 37 L-28 28 L-37 15 L-40 0 L-37 -15 L-28 -28 L-15 -37 L0 -40 L15 -37 L28 -28 L37 -15 Z" transform="rotate(180) scale(1.04)" fill="#e8452c" fill-opacity="0.85"/>
    <path d="M40 0 L37 15 L28 28 L15 37 L0 60 L-15 37 L-28 28 L-37 15 L-40 0 L-37 -15 L-28 -28 L-15 -37 L0 -40 L15 -37 L28 -28 L37 -15 Z" transform="rotate(180) scale(0.78)" fill="#ff7a3d" fill-opacity="0.9"/>
    <path d="M40 0 L37 15 L28 28 L15 37 L0 60 L-15 37 L-28 28 L-37 15 L-40 0 L-37 -15 L-28 -28 L-15 -37 L0 -40 L15 -37 L28 -28 L37 -15 Z" transform="rotate(180) scale(0.52)" fill="#ffb347"/>
    <path d="M40 0 L37 15 L28 28 L15 37 L0 60 L-15 37 L-28 28 L-37 15 L-40 0 L-37 -15 L-28 -28 L-15 -37 L0 -40 L15 -37 L28 -28 L37 -15 Z" transform="rotate(180) scale(0.26)" fill="#ffe08a"/>
  </g>
  <text x="870" y="265" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">4. five nested stages</text>
  <text x="870" y="284" fill="#a8a29e" font-size="12" text-anchor="middle">scaled 1/5 ... 5/5 about the</text>
  <text x="870" y="300" fill="#a8a29e" font-size="12" text-anchor="middle">centroid, revealed one by one</text>
</svg>
